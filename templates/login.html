{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #0d6efd 0%, #00b4d8 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-card {
        max-width: 380px;
        width: 90%;
        border: none;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        animation: fadeIn 0.6s ease-in-out;
    }

    .login-card .card-header {
        background: rgba(13, 110, 253, 0.9);
        color: white;
        text-align: center;
        font-size: 1.4rem;
        font-weight: 600;
        padding: 1rem;
    }

    .login-card .card-body {
        background: white;
        padding: 2rem;
    }

    .form-control {
        min-height: 44px;
        font-size: 1rem;
    }

    .btn-primary {
        min-height: 48px;
        font-size: 1.05rem;
        font-weight: 600;
        border-radius: 10px;
    }

    .app-name {
        font-weight: 700;
        font-size: 1.3rem;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(30px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="card login-card">
    <div class="card-header">
        <span class="app-name">🧾 Sistema de Soporte</span>
    </div>
    <div class="card-body">
        <form method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button class="btn btn-primary w-100 mt-2">Entrar</button>
        </form>

        <div class="text-center mt-3 text-muted small">
            <p class="mb-0">© {{ now().year if now else "2025" }} | Soporte Industrial</p>
        </div>
    </div>
</div>
{% endblock %}
