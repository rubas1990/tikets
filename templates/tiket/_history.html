<div class="card flex-fill shadow-sm">
    <div class="card-header text-center bg-light fw-bold">🕓 Historial de trabajo</div>
    <div class="card-body">
        <div class="scrollable-box">
            {% if sesiones %}
            <div class="table-responsive">
                <table class="table table-sm table-striped align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Usuario</th>
                            <th>Inicio</th>
                            <th>Fin</th>
                            <th>Duración (min)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for s in sesiones %}
                        <tr>
                            <td>{{ s['username'] }}</td>
                            <td>{{ s['inicio']|fmt_dt }}</td>
                            <td>{{ s['fin']|fmt_dt if s['fin'] else "⏳ En curso" }}</td>
                            <td>{{ s['duracion_min'] or "—" }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="text-muted text-center">Sin registros de tiempo aún.</p>
            {% endif %}
        </div>
    </div>
</div>
