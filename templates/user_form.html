{% extends "base.html" %}
{% block title %}Nuevo Usuario - Soporte{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title mb-3">Agregar nuevo usuario</h4>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre de usuario</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rol</label>
                        <select name="role" class="form-select">
                            <option value="user" selected>Usuario</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100">Crear usuario</button>
                    <a class="btn btn-secondary w-100 mt-2" href="{{ url_for('main.index') }}">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
